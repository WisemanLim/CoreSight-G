[project]
name = "coresight-g"
version = "0.1.0"
description = "CoreSight-G Platform — FastAPI + Multi AI Agent (Orchestrator + AI Assistant)"
requires-python = ">=3.12"
dependencies = [
  # web
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  # db
  "psycopg2-binary>=2.9",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "aiosqlite>=0.20",          # local SQLite async
  # auth
  "python-jose[cryptography]>=3.3",
  "bcrypt>=4.0",
  "python-multipart>=0.0.9",
  "pyotp>=2.9",
  # ai / llm — cloud
  "anthropic>=0.40",          # Orchestrator + Domain Agents (primary)
  "httpx>=0.27",              # Ollama REST fallback + A2A client + test
  # ai / llm — gateway (optional, uncomment if using LiteLLM Proxy)
  # "litellm>=1.40",
  # utils
  "python-dotenv>=1.0",
  "opentelemetry-sdk>=1.44.0",
  "opentelemetry-exporter-otlp-proto-http>=1.44.0",
  "opentelemetry-instrumentation-fastapi>=0.65b0",
  "opentelemetry-instrumentation-httpx>=0.65b0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.5",
  "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["test"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
