# CoreSight-G — Alertmanager 설정 (local/dev)
# 수신 알람을 백엔드 webhook 으로 전달 → tbl_alert_history 저장 + (설정 시) 외부 채널 중계
# local: 백엔드가 호스트(pm2)에서 실행 → host.docker.internal
# dev+ (api 컨테이너): url 을 http://api:8000/api/alerts/webhook 으로 교체
global:
  resolve_timeout: 1m

route:
  receiver: coresight-backend
  group_by: [alertname, Hostname]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 30m

receivers:
  - name: coresight-backend
    webhook_configs:
      - url: http://host.docker.internal:8100/api/alerts/webhook
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials: coresight-webhook-token   # ALERT_WEBHOOK_TOKEN 과 일치 (운영 시 변경)
