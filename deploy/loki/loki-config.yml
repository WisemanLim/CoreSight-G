# CoreSight-G — Loki 설정 (local/dev, 단일 바이너리 + 파일시스템 저장)
# 보존: 15일 (PRD §5 고해상도 단기 보존과 동일 계층)
auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 360h   # 15d

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
